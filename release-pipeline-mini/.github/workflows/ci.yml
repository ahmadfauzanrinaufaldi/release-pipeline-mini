name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t release-pipeline-mini:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 release-pipeline-mini:${{ github.sha }}
          for i in $(seq 1 10); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs localhost:8000/version
          docker rm -f smoke
