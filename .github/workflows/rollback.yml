name: Rollback

# Jalankan manual dari tab Actions: pilih environment dan versi yang ingin dipulihkan.
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment tujuan"
        required: true
        type: choice
        options: [dev, uat, prod]
      version:
        description: "Versi yang dipulihkan (contoh: v0.1.0 atau sha-abc1234)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pulihkan versi
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          VERSION: ${{ inputs.version }}
        run: |
          START=$(date +%s)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "$IMAGE:$VERSION"
          docker run -d --name app -p 8000:8000 "$IMAGE:$VERSION"
          for i in $(seq 1 10); do curl -fs localhost:8000/health && break || sleep 2; done
          ACTUAL=$(curl -fs localhost:8000/version)
          echo "Versi berjalan: $ACTUAL"
          echo "$ACTUAL" | grep -q "$VERSION"
          END=$(date +%s)
          echo "rollback | $(date -u +%FT%TZ) | $TARGET_ENV | $VERSION | success | $((END-START))s" | tee -a "$GITHUB_STEP_SUMMARY"
